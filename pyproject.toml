[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dvrec"
version = "0.1.0"
description = "FireWire DV/HDV tapeless recorder built on dvgrab"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
dvrec = "dvrec.cli:main"

[tool.setuptools]
packages = ["dvrec"]
